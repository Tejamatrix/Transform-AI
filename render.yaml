services:
  - type: web
    name: transformai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: GLM_API_KEY
        sync: false          # set in dashboard — never commit keys
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK
        value: offline
      - key: SECRET_KEY
        generateValue: true
      - key: EMBEDDING_PROVIDER
        value: hashed
      - key: EMBEDDING_DIM
        value: "512"
      - key: CORS_ORIGINS
        value: https://transformai-web.onrender.com

  - type: web
    name: transformai-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://transformai-api.onrender.com
      - key: NODE_VERSION
        value: "20"
